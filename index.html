:root{
  --bg:#0a1326; --panel:#111e3a; --panel2:#0d1830; --line:#22345c;
  --blue:#3d8bff; --blue-deep:#1b5fd6; --opp:#ff4d5e;
  --ink:#eaf1ff; --mut:#8296bb; --good:#39d98a;
  --disp:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --score:'Brickies','Barlow Condensed',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  background-image:radial-gradient(1200px 500px at 50% -150px, rgba(61,139,255,.14), transparent 70%);}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:50;background:rgba(10,19,38,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.crest{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:none;background:linear-gradient(160deg,var(--blue),var(--blue-deep))}
.crest img{width:100%;height:100%;object-fit:cover;display:block}
.htitle b{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.15}
.htitle span{color:var(--mut);font-size:12px;letter-spacing:.04em}
.match-sel{margin-left:auto}
.match-sel select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:var(--disp);
  font-size:14px;letter-spacing:.05em;padding:9px 12px;border-radius:10px;cursor:pointer;max-width:280px}
nav{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px}
nav button{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:.09em;text-transform:uppercase;background:none;border:0;color:var(--mut);padding:8px 15px;border-radius:8px;cursor:pointer;transition:.18s}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--blue-deep);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
.page{display:none}.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* hero */
.hero{background:linear-gradient(180deg,#13234a,var(--panel2));border:1px solid var(--line);border-radius:18px;padding:26px 28px 22px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(600px 220px at 20% 0%, rgba(61,139,255,.18), transparent 60%),
  radial-gradient(600px 220px at 80% 0%, rgba(255,77,94,.08), transparent 60%)}
.meta{font-family:var(--disp);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-size:13px;position:relative}
.scoreline{display:flex;align-items:center;justify-content:center;gap:26px;margin:14px 0 4px;flex-wrap:wrap;position:relative}
.team-name{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;min-width:190px}
.team-name small{display:block;font-size:12px;font-weight:600;letter-spacing:.2em;margin-top:2px}
.team-name.home small{color:var(--blue)} .team-name.away small{color:var(--opp)}
.score{font-family:var(--score);font-weight:700;font-size:72px;line-height:1;background:#0a1428;border:1px solid var(--line);border-radius:14px;padding:6px 24px 10px;display:flex;gap:18px}
.score .dash{color:var(--mut);font-weight:500}
.halves{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;position:relative}
.half-chip{background:#0a1428;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--mut)}
.half-chip b{color:var(--ink);font-family:var(--disp);font-size:15px;letter-spacing:.05em}
.poss{margin-top:20px;position:relative}
.poss-labels{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:700;font-size:22px;margin-bottom:6px}
.poss-labels .l{color:var(--blue)} .poss-labels .r{color:var(--opp)}
.poss-labels span small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 8px}
.poss-bar{height:14px;border-radius:999px;overflow:hidden;display:flex;background:#0a1428;border:1px solid var(--line)}
.poss-bar .a{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.poss-bar .b{background:linear-gradient(90deg,#8a2432,var(--opp))}
.hero-foot{display:flex;justify-content:center;gap:28px;margin-top:16px;color:var(--mut);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap;position:relative}
.hero-foot b{color:var(--ink);font-family:var(--disp);font-size:16px;margin-right:5px}

/* sections */
.section{margin-top:34px}
.sec-title{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title em{font-style:normal;color:var(--blue);font-size:13px;letter-spacing:.2em}
.mirror{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.mrow{display:grid;grid-template-columns:64px 1fr 190px 1fr 64px;align-items:center;gap:12px;padding:9px 0}
.mrow + .mrow{border-top:1px solid rgba(34,52,92,.5)}
.mrow .v{font-family:var(--disp);font-weight:700;font-size:22px;text-align:center}
.mrow .v.win{color:var(--ink)} .mrow .v.lose{color:var(--mut)}
.mrow .lab{text-align:center;font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.mbar{height:9px;border-radius:999px;background:#0a1428;overflow:hidden;display:flex}
.mbar.left{justify-content:flex-end}
.mbar i{display:block;height:100%;border-radius:999px}
.mbar.left i{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.mbar.right i{background:linear-gradient(90deg,var(--opp),#8a2432)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.p-title{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.p-title b{color:var(--ink);font-size:20px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;color:var(--mut)}
.stat-line b{font-family:var(--disp);font-size:18px;color:var(--ink);font-weight:600}
.pct{color:var(--good);font-size:13px;font-family:var(--disp);margin-left:8px}
.bar{height:7px;border-radius:999px;background:#0a1428;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-deep),var(--blue));border-radius:999px}
.bar.gold i{background:linear-gradient(90deg,#8a2432,var(--opp))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.tag{display:inline-block;background:#0a1428;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:3px 4px 3px 0;font-size:13px;color:var(--mut)}
.tag b{font-family:var(--disp);color:var(--ink);font-size:16px;margin-left:7px}
.side-h{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin:4px 0 8px}
.side-h.home{color:var(--blue)}.side-h.away{color:var(--opp)}
.chips{display:flex;flex-wrap:wrap}

/* players */
.players-wrap{display:grid;grid-template-columns:295px 1fr;gap:18px;align-items:start}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.plist button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;font-family:var(--body);transition:.15s}
.plist button:hover{background:#16264a}
.plist button.on{background:var(--blue-deep)}
.jersey{width:34px;height:34px;flex:none;border-radius:9px;background:#0a1428;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--blue)}
.plist button.on .jersey{color:#fff;background:rgba(255,255,255,.12);border-color:transparent}
.pl-name{font-weight:600;font-size:14px;line-height:1.2}
.pl-sub{font-size:11.5px;color:var(--mut)}
.plist button.on .pl-sub{color:rgba(255,255,255,.75)}
.badge{margin-left:auto;font-family:var(--disp);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.badge.g{background:rgba(57,217,138,.15);color:var(--good)}
.badge.gk{background:rgba(255,77,94,.14);color:var(--opp)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.phead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(160deg,var(--blue),var(--blue-deep));display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:24px;color:#fff}
.pname{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.psub{color:var(--mut);font-size:13px;margin-top:5px}
.kpis{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:#0a1428;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;min-width:76px}
.kpi b{font-family:var(--disp);font-weight:700;font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.kpi.hl b{color:var(--good)}
.block-h{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.16em;text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.block-h::after{content:"";flex:1;height:1px;background:var(--line)}
.block-h.avg{color:var(--blue)} .block-h.tot{color:var(--opp)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.pbox h4{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.pbox h4.def{color:var(--opp)}
.prow{display:grid;grid-template-columns:1fr 84px 74px;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;color:var(--mut)}
.prow b{font-family:var(--disp);font-size:16px;color:var(--ink);font-weight:600;text-align:right}
.prow .sr{font-family:var(--disp);font-size:13px;text-align:right;color:var(--good)}
.prow .sr.na{color:#3a4c74}
.minibar{grid-column:1/-1;height:5px;border-radius:999px;background:#0a1428;overflow:hidden;margin-bottom:3px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.empty-note{color:var(--mut);font-size:13px;padding:6px 0}
.pos-badge{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.08em;border-radius:5px;padding:1px 6px;vertical-align:1px}
.pos-fwd{background:rgba(255,84,112,.16);color:#ff5470}
.pos-mid{background:rgba(57,217,138,.16);color:var(--good)}
.pos-def{background:rgba(61,139,255,.16);color:var(--blue)}
.pos-gk{background:rgba(255,210,63,.16);color:#ffd23f}
.stat-group-title{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.stat-group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.stat-group-title.def{color:var(--opp)}
.stat-group-title:first-child{margin-top:2px}
.kpi-tiles{display:flex;flex-wrap:wrap;gap:8px}
.kpi-tiles .kpi{min-width:64px}
.kpi-pct{font-family:var(--body);font-weight:600;font-size:12px;color:var(--good);margin-left:5px}

/* comparison */
.cbar-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.controls select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:var(--disp);font-size:14px;padding:9px 12px;border-radius:10px;cursor:pointer}
.mode{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px}
.mode button{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--mut);padding:7px 14px;border-radius:7px;cursor:pointer}
.mode button.on{background:var(--blue-deep);color:#fff}
.scope-note{color:var(--mut);font-size:12.5px;margin-left:auto;letter-spacing:.05em}
.cbar{display:grid;grid-template-columns:190px 1fr 96px;align-items:center;gap:12px;padding:6px 0}
.cbar + .cbar{border-top:1px solid rgba(34,52,92,.4)}
.cbar .cname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .track{height:16px;border-radius:6px;background:#0a1428;overflow:hidden}
.cbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-deep),var(--blue));border-radius:6px;min-width:2px}
.cbar.top .track i{background:linear-gradient(90deg,#22b573,var(--good))}
.cbar .cval{font-family:var(--disp);font-weight:700;font-size:16px;text-align:right}
.cbar .cval small{color:var(--mut);font-weight:500;font-size:12px;margin-left:5px}

/* radar comparison */
.radar-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.radar-layout{display:grid;grid-template-columns:236px 1fr 236px;gap:20px;align-items:start}
.radar-side{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.rs-h{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:baseline;gap:6px}
.rs-h .rs-hint{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:11px;color:var(--mut);opacity:.75}

.radar-players{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.rp-btn{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 10px 7px 7px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.rp-btn:hover{background:#132444}
.rp-btn.on{background:#132a52}
.rp-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:12px;flex:none}
.rp-meta{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.rp-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-sub{font-size:10.5px;color:var(--mut);letter-spacing:.03em;display:flex;align-items:center;gap:5px}
.rp-pos{font-family:var(--disp);font-weight:700;font-size:9.5px;letter-spacing:.06em;padding:0 5px;border-radius:4px;line-height:1.5}
.rp-dot{width:10px;height:10px;border-radius:50%;flex:none;margin-left:2px}

.radar-center{display:flex;flex-direction:column;gap:16px}
.radar-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px}
.radar-card .rc-title{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:6px}
.radar-card svg{display:block;width:100%;height:auto}
.radar-empty{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--mut);font-size:14px;text-align:center;padding:0 20px}
.radar-legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.radar-legend .lg-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.radar-legend .lg-swatch{width:12px;height:12px;border-radius:3px;flex:none}

.axis-chips{display:flex;flex-wrap:wrap;gap:6px}
.ax-chip{font-size:12px;background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:5px 10px;border-radius:8px;cursor:pointer;transition:all .12s}
.ax-chip:hover{border-color:var(--blue-deep)}
.ax-chip.on{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}

@media (max-width:960px){
  .radar-layout{grid-template-columns:1fr}
  .radar-players{max-height:260px}
}
footer{border-top:1px solid var(--line);color:var(--mut);text-align:center;padding:22px;font-size:12.5px;letter-spacing:.05em}

/* period toggle (reuses .mode look) */
.period-toggle{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;width:max-content;margin:0 auto 18px}
.period-toggle button{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--mut);padding:8px 16px;border-radius:7px;cursor:pointer}
.period-toggle button.on{background:var(--blue-deep);color:#fff}

/* final-1/3 breakdown under the mirror table */
.entry3-detail{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;padding-top:10px;margin-top:6px;border-top:1px solid rgba(34,52,92,.5)}
.entry3-detail .side-h{margin-bottom:6px}

/* plain label/value rows (no bar) — used for Defensive Actions panel */
.plain-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;color:var(--mut)}
.plain-row + .plain-row{border-top:1px solid rgba(34,52,92,.4)}
.plain-row b{font-family:var(--disp);font-size:18px;color:var(--ink);font-weight:600}

/* shot map */
.pitch-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.pitch-svg{width:100%;max-width:430px;height:auto}
.pitch-legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--mut)}
.pitch-legend .lg{display:flex;align-items:center;gap:7px}
.lg-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.lg-dot.outline{background:none;border:1.6px solid currentColor}
.lg-dot.dash{background:none;border:1.6px dashed currentColor}
.lg-ball{width:13px;height:13px;flex:none}

@media (max-width:960px){
  .c3,.c4,.c6,.c8{grid-column:span 12}
  .players-wrap{grid-template-columns:1fr}
  .plist{position:static;max-height:230px}
  .pgrid{grid-template-columns:1fr}
  .mrow{grid-template-columns:44px 1fr 106px 1fr 44px}
  .score{font-size:50px}.team-name{font-size:19px;min-width:104px}
  .kpis{margin-left:0}
  .cbar{grid-template-columns:120px 1fr 84px}
  .match-sel{margin-left:0;width:100%}
  .match-sel select{width:100%;max-width:none}
}
</style>

const M = DATA.matches;

/* ---------- helpers ---------- */
const el = h => {const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const pct = (a,b)=> b? Math.round(a/b*100) : null;
const fmt = v => v==null? '—' : (Number.isInteger(v)? v : (+v).toFixed(1));
const initials = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const matchLabel = m => `vs ${m.meta.opponent} (${m.meta.venue}) ${m.meta.dateLabel}`;

function deepAvg(objs){ // average numeric leaves across same-shaped objects
  const out = Array.isArray(objs[0])? [] : {};
  for(const k of Object.keys(objs[0])){
    const vals = objs.map(o=>o[k]);
    if(typeof vals[0]==='number') out[k] = vals.reduce((a,b)=>a+b,0)/vals.length;
    else if(vals[0] && typeof vals[0]==='object') out[k] = deepAvg(vals);
    else out[k] = vals[0];
  }
  return out;
}
function deepSum(objs){
  const out = Array.isArray(objs[0])? [] : {};
  for(const k of Object.keys(objs[0])){
    const vals = objs.map(o=>o[k]).filter(v=>v!=null);
    if(!vals.length){out[k]=null;continue}
    if(typeof vals[0]==='number') out[k] = vals.reduce((a,b)=>a+b,0);
    else if(typeof vals[0]==='object') out[k] = deepSum(vals);
    else out[k] = vals[0];
  }
  return out;
}
function deepScale(o,f){
  if(typeof o==='number') return o/f;
  if(o && typeof o==='object'){
    const out = Array.isArray(o)? [] : {};
    for(const k of Object.keys(o)) out[k]=deepScale(o[k],f);
    return out;
  }
  return o;
}

/* player aggregation across matches */
const ALL_PLAYERS = {};
M.forEach(m => Object.entries(m.players).forEach(([n,p])=>{
  (ALL_PLAYERS[n] = ALL_PLAYERS[n]||[]).push(p);
}));
const AGG = {}; // {name: {apps, tot, avg}}
Object.entries(ALL_PLAYERS).forEach(([n,list])=>{
  const tot = deepSum(list);
  AGG[n] = {apps: list.length, tot, avg: deepScale(tot, list.length)};
});

/* ---------- state ---------- */
let sel = -1;         // -1 = all matches
let curPeriod = 'full'; // '1st' | '2nd' | 'full' — only meaningful when sel!==-1
let curPlayer = null; // player name
let cmpMode = 'count', cmpMetric = 0;

/* ---------- header ---------- */
(function initSel(){
  const s = document.getElementById('matchSel');
  s.appendChild(el(`<option value="-1">All Matches — Average</option>`));
  M.forEach((m,i)=> s.appendChild(el(`<option value="${i}">${matchLabel(m)}</option>`)));
  s.value = "-1";
  s.addEventListener('change', ()=>{ sel = +s.value; curPeriod='full'; renderAll(); });
})();
['team','players','compare'].forEach(p=>{
  document.getElementById('tab-'+p).addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.id==='tab-'+p));
    document.querySelectorAll('.page').forEach(pg=>pg.classList.toggle('on', pg.id==='page-'+p));
    window.scrollTo({top:0});
  });
});

  const b = e.target.closest('[data-period]');

  curPeriod = b.dataset.period;
  renderTeam();

function mirrorRows(t){
  const c=t.chance, o=t.oppChance;
  const shots=(x)=>x.on+x.off+x.blocked;
  return [
    ["Goals", t.goals, t.goalsAgainst],
    ["Chances Created", c.n, o.n],
    ["Total Shots", shots(c), shots(o)],
    ["Shots on Target", c.on, o.on],
    ["Shots in the Box", c.box, o.box],
    ["Touches in the Box", t.touchBox, t.oppTouchBox],
    ["Crosses", t.cross.total, t.oppCross.total],
    ["Corners", t.setPlay.corner, t.oppSetPlay.corner],
    ["Offsides", t.offside, t.oppOffside],
    ["Final 1/3 Entries", t.entry3+t.setPlay.throwFinal3+t.trans.final, t.oppEntry3+t.oppSetPlay.throwFinal3+t.oppTrans.final],
  ];
}

/* ---------- shot map ---------- */
function starMark(x,y,R,color){
  // 5-point star for goals, colored per team
  const n=5, rIn=R*0.42;
  const pts=[];
  for(let i=0;i<n*2;i++){
    const r = i%2===0? R : rIn;
    const a = -Math.PI/2 + i*Math.PI/n;
    pts.push(`${(x+Math.cos(a)*r).toFixed(2)},${(y+Math.sin(a)*r).toFixed(2)}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${color}" stroke="#0a1428" stroke-width="0.15"/>`;
}
function shotMapSVG(shots, color){
  const W=68, H=52.5;
  const toXY = s => {
    const X = Math.min(100,Math.max(50,s.x));
    return [ s.y/100*W, (100-X)/50*H ];
  };
  const order = {off:0, blocked:1, on:2, goal:3}; // draw goals last (on top)
  const sorted = shots.slice().sort((a,b)=>order[a.result]-order[b.result]);
  let markers = '';
  sorted.forEach(s=>{
    const [x,y] = toXY(s);
    if(s.result==='goal'){
      markers += starMark(x, y, 1.3, color);
    } else if(s.result==='on'){
      markers += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="0.8" fill="${color}" stroke="#0a1428" stroke-width="0.18"/>`;
    } else if(s.result==='blocked'){
      markers += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="0.8" fill="none" stroke="${color}" stroke-width="0.32" stroke-dasharray="0.5 0.55"/>`;
    } else {
      markers += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="0.8" fill="none" stroke="${color}" stroke-width="0.32"/>`;
    }
  });
  // static pitch markings — half pitch, goal at top (y=0), halfway line at bottom (y=H)
  return `<svg viewBox="-3 -4 ${W+6} ${H+6}" class="pitch-svg" role="img" aria-label="Shot map">
    <rect x="-3" y="-4" width="${W+6}" height="${H+6}" fill="#0a1428"/>

    <rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#22345c" stroke-width="0.4"/>
    <rect x="${((W-40.32)/2).toFixed(2)}" y="0" width="40.32" height="16.5" fill="none" stroke="#22345c" stroke-width="0.4"/>
    <rect x="${((W-18.32)/2).toFixed(2)}" y="0" width="18.32" height="5.5" fill="none" stroke="#22345c" stroke-width="0.4"/>
    <rect x="${((W-7.32)/2).toFixed(2)}" y="-2.2" width="7.32" height="2.2" fill="none" stroke="#22345c" stroke-width="0.5"/>
    <circle cx="${(W/2).toFixed(2)}" cy="11" r="0.45" fill="#22345c"/>
    <path d="M 26.69,16.5 A 9.15,9.15 0 0 1 41.31,16.5" fill="none" stroke="#22345c" stroke-width="0.4"/>
    <path d="M 24.85,${H} A 9.15,9.15 0 0 0 43.15,${H}" fill="none" stroke="#22345c" stroke-width="0.4"/>
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#22345c" stroke-width="0.4"/>
    ${markers}
  </svg>`;
}

/* team passing & duels come from summing player data of the scope */
function scopePlayers(){
  if(sel===-1){
    return Object.fromEntries(Object.entries(AGG).map(([n,a])=>[n,a.tot]));
  }
  return M[sel].players;
}
function teamPassTitle(){
  const P = Object.values(scopePlayers());
  const div = sel===-1? M.length : 1;
  const t = P.reduce((a,p)=>a+p.passes.Total[0],0)/div, s = P.reduce((a,p)=>a+p.passes.Total[1],0)/div;
  return `<b class="num">${fmt(s)}/${fmt(t)} <span class="pct" style="font-size:15px">${pct(s,t)??0}%</span></b>`;
}
function teamPassing(){
  const P = Object.values(scopePlayers());
  const div = sel===-1? M.length : 1;
  const S = k => [P.reduce((a,p)=>a+p.passes[k][0],0)/div, P.reduce((a,p)=>a+p.passes[k][1],0)/div];
  const rows = [["Forward","Forward"],["Lateral","Lateral"],["Backward","Backward"],["Long","Long"],["Balls in behind","In Behind"],["Crosses","Cross"]]
    .map(([lab,k])=>{const [t,s]=S(k);return {lab,t,s}}).filter(r=>r.t>0);
  const kp = P.reduce((a,p)=>a+p.keyPass,0)/div;
  return rows.map(r=>`
    <div class="stat-line"><span>${r.lab}</span><span><b class="num">${fmt(r.s)}/${fmt(r.t)}</b><span class="pct num">${pct(r.s,r.t)}%</span></span></div>
    <div class="bar"><i style="width:${pct(r.s,r.t)}%"></i></div>`).join('') +
    `<div class="stat-line"><span>Key Pass</span><b class="num">${fmt(kp)}</b></div>
     <div class="bar"><i style="width:100%"></i></div>`;
}
function teamDuels(){
  const P = Object.values(scopePlayers());
  const div = sel===-1? M.length : 1;
  const S = k => [P.reduce((a,p)=>a+p[k][0],0)/div, P.reduce((a,p)=>a+p[k][1],0)/div];
  const rows = [["Offensive duels","offDuel"],["1v1 attack","a1v1"],["1v1 defence","d1v1"],["Defensive duels","defDuel"],["Aerial duels","aerial"],["Tackles","tackles"],["2nd balls","second"]]
    .map(([lab,k])=>{const [t,s]=S(k);return {lab,t,s}}).filter(r=>r.t>0);
  return rows.map(r=>`
    <div class="stat-line"><span>${r.lab}</span><span><b class="num">${fmt(r.s)}/${fmt(r.t)}</b><span class="pct num">${pct(r.s,r.t)}%</span></span></div>
    <div class="bar"><i style="width:${pct(r.s,r.t)}%"></i></div>`).join('');
}
function teamDefActions(){
  const P = Object.values(scopePlayers());
  const div = sel===-1? M.length : 1;
  const N = k => P.reduce((a,p)=>a+p[k],0)/div;
  const rows = [["Interceptions","interception"],["Recoveries","recovery"],["Turnovers won","turnoverWon"],
    ["Clearances","clearance"],["Blocked shots","blockedShots"],["Fouls","fouls"],["Fouls won","wonFouls"]]
    .filter(([,k])=> k!=="blockedShots"); // not tracked per-player; omit if absent
  return rows.map(([l,k])=>`<div class="plain-row"><span>${l}</span><b class="num">${fmt(N(k))}</b></div>`).join('');
}

/* ---------- PLAYER PAGE ---------- */
function playerNames(){
  const src = sel===-1? Object.keys(AGG) : Object.keys(M[sel].players);
  return src.sort((a,b)=>{
    const A = sel===-1? AGG[a].tot : M[sel].players[a];
    const B = sel===-1? AGG[b].tot : M[sel].players[b];
    const ga=(B.goals+B.assists)-(A.goals+A.assists);
    if(ga) return ga;
    return (B.passes.Total[0]-A.passes.Total[0]) || a.localeCompare(b);
  });
}

  const posAbbrev = {FWD:'FWD',MID:'MF',DEF:'DEF',GK:'GK'};
  names.forEach(n=>{
    const p = sel===-1? AGG[n].tot : M[sel].players[n];
    const apps = sel===-1? AGG[n].apps : 1;
    const sub = `${apps} app${apps>1?'s':''}${p.mins!=null? ' · '+p.mins+' mins':''}`;
    const gaParts = [p.goals? `${p.goals}G`:'', p.assists? `${p.assists}A`:''].filter(Boolean).join(' ');
    const btn = el(`<button role="option" ${n===curPlayer?'class="on"':''}>
      <span class="jersey">${initials(n)}</span>
      <span><span class="pl-name">${n}</span><br><span class="pl-sub num">${sub}${p.position?` · <span class="pos-badge ${posClass[p.position]||''}">${posAbbrev[p.position]||p.position}</span>`:''}</span></span>
      ${gaParts?`<span class="badge g num">${gaParts}</span>`:''}
    </button>`);
    btn.addEventListener('click',()=>{curPlayer=n;renderPlayerList();renderPlayerCard();});
    list.appendChild(btn);
  });
}
const prow = (label,t,s)=>{const r=t?pct(s,t):null;return `
  <div class="prow"><span>${label}</span><b class="num">${fmt(s)}/${fmt(t)}</b>
  <span class="sr num ${r==null?'na':''}">${r==null?'—':r+'%'}</span>
  <div class="minibar"><i style="width:${r??0}%"></i></div></div>`;};
const prowN = (label,v)=>`<div class="prow"><span>${label}</span><b class="num">${fmt(v)}</b><span class="sr na">—</span></div>`;
const prowBar = (label,v)=>`<div class="prow"><span>${label}</span><b class="num">${fmt(v)}</b><span class="sr na">—</span>
  <div class="minibar"><i style="width:100%"></i></div></div>`;

function statBlocks(p){
  const ps=p.passes;
  const isGK = p.position==='GK';
  const kpi = (label,v,hl=false)=>`<div class="kpi${hl?' hl':''}"><b class="num">${fmt(v)}</b><span>${label}</span></div>`;

  const lostTiles = [kpi('Ball Received',p.received), kpi('Ball Lost',p.lost),
    kpi('Lost Final 1/3',p.lostThirds[2]), kpi('Lost Middle 1/3',p.lostThirds[1]), kpi('Lost Own 1/3',p.lostThirds[0])]
    .concat(isGK? [kpi('Critical +', p.critical, !!p.critical)] : []).join('');
  const shotTiles = [kpi('Goal',p.goals,!!p.goals), kpi('Assist',p.assists,!!p.assists),
    kpi('On Target',p.shots[1]), kpi('Off Target',p.shots[2]), kpi('Blocked',p.shots[3]), kpi('Critical +',p.critical,!!p.critical)].join('');
  const statsHTML = isGK
    ? `<div class="kpi-tiles">${lostTiles}</div>`
    : `<div class="kpi-tiles">${shotTiles}</div><div class="kpi-tiles" style="margin-top:8px">${lostTiles}</div>`;

  const inPossBarsGK=[["Total passes",ps.Total],["Forward passes",ps.Forward],["Lateral passes",ps.Lateral],
    ["Backward passes",ps.Backward],["Long passes",ps.Long],["Passes in behind",ps["In Behind"]]];
  const inPossBars=[["Total passes",ps.Total],["Forward passes",ps.Forward],["Lateral passes",ps.Lateral],
    ["Backward passes",ps.Backward],["Long passes",ps.Long],["Passes in behind",ps["In Behind"]],
    ["Cross",ps.Cross],["1v1 attack",p.a1v1],["Offensive duel",p.offDuel]];
  const inPossPlain=[["Key Pass",p.keyPass],["Acceleration",p.accel],["Touches in the box",p.touchBox],
    ["Runs in behind",p.runsBehind],["Move into pocket",p.pocket],["Wide area",p.wide],
    ["Back to goal",p.backToGoal],["Over/underlaps",p.overlaps],["Half-space runs",p.halfspace]];

  const outPossBars=[["Defensive duel",p.defDuel],["Aerial duel",p.aerial],["1v1 defence",p.d1v1],
    ["Tackles",p.tackles],["Loose ball",p.second]];
  const outPossPlain=[["Turnover won",p.turnoverWon],["Interception",p.interception],["Clearance",p.clearance],
    ["Recovery run",p.recovery],["Fouls",p.fouls],["Won fouls",p.wonFouls]];
  const gkTiles = p.gk? [kpi('Saves',p.gk.save),kpi('Conceded',p.gk.conceded),kpi('Faced On Target',p.gk.onT),
    kpi('Faced Off Target',p.gk.offT),kpi('1v1 Faced',p.gk.gk1v1),kpi('Defend Space',p.gk.space),
    kpi('Defend Line',p.gk.line),kpi('Counter Kicks',p.gk.counterKick)].join('') : '<div class="empty-note">No GK actions recorded.</div>';

  return `
  <div class="stat-group-title">Stats</div>
  ${statsHTML}

  <div class="stat-group-title">In Possession</div>
  ${isGK? `<div class="pbox">${inPossBarsGK.map(r=>prow(r[0],r[1][0],r[1][1])).join('')}</div>` : `
  <div class="pgrid">
    <div class="pbox">
      ${inPossBars.map(r=>prow(r[0],r[1][0],r[1][1])).join('')}
    </div>
    <div class="pbox">
      ${inPossPlain.map(r=>prowN(r[0],r[1])).join('')}
    </div>
  </div>`}

  ${isGK? `
  <div class="stat-group-title def">Goalkeeper</div>
  <div class="kpi-tiles">${gkTiles}</div>` : `
  <div class="stat-group-title def">Out of Possession</div>
  <div class="pgrid">
    <div class="pbox">
      ${outPossBars.map(r=>prow(r[0],r[1][0],r[1][1])).join('')}
    </div>
    <div class="pbox">
      ${outPossPlain.map(r=>prowN(r[0],r[1])).join('')}
    </div>
  </div>`}`;
}
function positionKPIs(p){
  const kv = (label,v,pctVal,hl=false)=>`<div class="kpi${hl?' hl':''}"><b class="num">${fmt(v)}${pctVal!=null?`<span class="kpi-pct num">${pctVal}%</span>`:''}</b><span>${label}</span></div>`;
  const kvFrac = (label,s,t)=>{const p_=t?pct(s,t):null;return `<div class="kpi"><b class="num">${fmt(s)}/${fmt(t)}${p_!=null?`<span class="kpi-pct num">${p_}%</span>`:''}</b><span>${label}</span></div>`;};
  const base = [kv('Goals',p.goals,null,!!p.goals), kv('Assist',p.assists,null,!!p.assists)];
  let extra;
  if(p.position==='FWD'){
    extra = [kvFrac('Shots on Target',p.shots[1],p.shots[0])];
  } else if(p.position==='MID'){
    extra = [kv('Key Pass',p.keyPass,null), kvFrac('Pass',p.passes.Total[1],p.passes.Total[0])];
  } else if(p.position==='DEF'){
    extra = [kvFrac('Defensive Duel',p.defDuel[1],p.defDuel[0]), kvFrac('Pass',p.passes.Total[1],p.passes.Total[0])];
  } else if(p.position==='GK'){
    extra = [kvFrac('Saves', p.gk? p.gk.save : 0, p.gk? p.gk.save+p.gk.conceded : 0)];
  } else {
    extra = [kv('Shots',p.shots[0],null), kvFrac('Pass',p.passes.Total[1],p.passes.Total[0])];
  }
  return `<div class="kpis">${base.concat(extra).join('')}</div>`;
}
const POS_FULL = {FWD:'Forward',MID:'Midfielder',DEF:'Defender',GK:'Goalkeeper'};
function renderPlayerCard(){
  const n = curPlayer;
  const isAvg = sel===-1;
  const box = document.getElementById('pdetail');
  if(isAvg){
    const a = AGG[n];
    const head = `<div class="phead">
      <div class="avatar">${initials(n)}</div>
      <div><div class="pname">${n}</div>
        <div class="psub num">${a.apps} appearance${a.apps>1?'s':''}${a.tot.mins!=null? ' · '+a.tot.mins+' mins total':''}${a.tot.position? ' · '+(POS_FULL[a.tot.position]||a.tot.position):''}</div></div>
      ${positionKPIs(a.tot)}</div>`;
    box.innerHTML = `<div class="pcard">${head}
      <div class="block-h avg">Per Match Average</div>${statBlocks(a.avg)}
      <div class="block-h tot">Totals — ${a.apps} match${a.apps>1?'es':''}</div>${statBlocks(a.tot)}
    </div>`;
  } else {
    const p = M[sel].players[n];
    const head = `<div class="phead">
      <div class="avatar">${initials(n)}</div>
      <div><div class="pname">${n}</div>
        <div class="psub num">${matchLabel(M[sel])}${p.mins!=null? ' · '+p.mins+' mins':''}${p.position? ' · '+(POS_FULL[p.position]||p.position):''}</div></div>
      ${positionKPIs(p)}</div>`;
    box.innerHTML = `<div class="pcard">${head}<div style="height:16px"></div>${statBlocks(p)}</div>`;
  }
}

/* ---------- COMPARISON PAGE ---------- */
const COUNT_METRICS = [
  ["Goals", p=>p.goals],["Assists", p=>p.assists],["Shots", p=>p.shots[0]],["Shots on target", p=>p.shots[1]],
  ["Total passes", p=>p.passes.Total[0]],
  ["Forward passes", p=>p.passes.Forward[0]],["Long pass", p=>p.passes.Long[0]],["Passes received", p=>p.received],
  ["Key Pass", p=>p.keyPass],["Balls in behind", p=>p.passes["In Behind"][0]],
  ["Crosses", p=>p.passes.Cross[0]],["Touches in the box", p=>p.touchBox],
  ["1v1 attacks", p=>p.a1v1[0]],["Accelerations", p=>p.accel],["Runs in behind", p=>p.runsBehind],
  ["Move into pocket", p=>p.pocket],["Wide area", p=>p.wide],["Back to goal", p=>p.backToGoal],
  ["Defensive duels", p=>p.defDuel[0]],["Aerial duels", p=>p.aerial[0]],["Interceptions", p=>p.interception],
  ["Recoveries", p=>p.recovery],["Turnovers won", p=>p.turnoverWon],
  ["2nd balls", p=>p.second[1]],["Ball lost", p=>p.lost],["Fouls won", p=>p.wonFouls],
];
const PCT_METRICS = [
  ["Pass accuracy %", p=>p.passes.Total],
  ["Forward pass %", p=>p.passes.Forward],
  ["Long pass %", p=>p.passes.Long],
  ["Balls in behind %", p=>p.passes["In Behind"]],
  ["Cross accuracy %", p=>p.passes.Cross],
  ["On Target %", p=>[p.shots[0], p.shots[1]]],
  ["1v1 attack success %", p=>p.a1v1],
  ["Offensive duel %", p=>p.offDuel],
  ["Defensive duel %", p=>p.defDuel],
  ["1v1 defence %", p=>p.d1v1],
  ["Tackle success %", p=>p.tackles],
  ["2nd ball %", p=>p.second],
  ["Aerial duel %", p=>p.aerial],
  ["All duels won %", p=>{const ks=['defDuel','d1v1','aerial','tackles','second','offDuel','a1v1'];
      return [ks.reduce((a,k)=>a+p[k][0],0), ks.reduce((a,k)=>a+p[k][1],0)];}],
];
function initCompare(){
  const ms = document.getElementById('metricSel');
  const fill = ()=>{
    ms.innerHTML='';
    (cmpMode==='count'? COUNT_METRICS : PCT_METRICS).forEach((m,i)=> ms.appendChild(el(`<option value="${i}">${m[0]}</option>`)));
    cmpMetric = 0; ms.value = "0";
  };
  fill();
  ms.addEventListener('change', ()=>{cmpMetric=+ms.value; renderCompare();});
  document.querySelectorAll('#modeBtns button').forEach(b=>b.addEventListener('click',()=>{
    cmpMode=b.dataset.mode;
    document.querySelectorAll('#modeBtns button').forEach(x=>x.classList.toggle('on',x===b));
    fill(); renderCompare();
  }));
  initRadar();
}
/* ---------- RADAR ---------- */
const RADAR_COUNT = [
  ["Goals",          p=>p.goals],
  ["Shots",          p=>p.shots[0]],
  ["Key Passes",     p=>p.keyPass],
  ["Total Passes",   p=>p.passes.Total[0]],
  ["Fwd Passes",     p=>p.passes.Forward[0]],
  ["Passes Rec.",    p=>p.received],
  ["Crosses",        p=>p.passes.Cross[0]],
  ["1v1 Attacks",    p=>p.a1v1[0]],
  ["Touches in Box", p=>p.touchBox],
  ["Tackles Won",    p=>p.tackles[1]],
  ["Interceptions",  p=>p.interception],
  ["Recoveries",     p=>p.recovery],
  ["Aerial Duels",   p=>p.aerial[0]],
  ["Def. Duels",     p=>p.defDuel[0]],
  ["Turnovers Won",  p=>p.turnoverWon],
];
const RADAR_PCT = [
  ["Pass %",       p=>p.passes.Total],
  ["Fwd Pass %",   p=>p.passes.Forward],
  ["Long Pass %",  p=>p.passes.Long],
  ["Cross %",      p=>p.passes.Cross],
  ["On Target %",  p=>[p.shots[0], p.shots[1]]],
  ["1v1 Atk %",    p=>p.a1v1],
  ["Tackle %",     p=>p.tackles],
  ["Aerial %",     p=>p.aerial],
  ["Def. Duel %",  p=>p.defDuel],
  ["2nd Ball %",   p=>p.second],
];
const RADAR_COUNT_DEFAULT = ["Goals","Shots","Key Passes","Total Passes","Passes Rec.","Tackles Won","Recoveries","Aerial Duels"];
const RADAR_PCT_DEFAULT   = ["Pass %","Fwd Pass %","On Target %","Tackle %","Aerial %"];
const RADAR_COLORS = ['#3d8bff','#39d98a','#ffb020','#c07cff','#ff4d5e'];
/* same position palette used on the Player Stats page (.pos-fwd/.pos-mid/.pos-def/.pos-gk) */
const POS_COLORS = {FWD:'#ff5470', MID:'#39d98a', DEF:'#3d8bff', GK:'#ffd23f'};
const POS_ABBR   = {FWD:'FWD', MID:'MF', DEF:'DEF', GK:'GK'};

let radarSel = [];   // selected player names (max 5)
let axCount = RADAR_COUNT_DEFAULT.slice();
let axPct   = RADAR_PCT_DEFAULT.slice();

const safe = (fn,p)=>{ try{ const v=fn(p); return v; }catch(e){ return 0; } };

/* per-game-average player data for the current scope, by name */
function radarData(){
  if(sel===-1) return Object.fromEntries(Object.entries(AGG).map(([n,a])=>[n,a.avg]));
  return M[sel].players;
}
function radarApps(n){ return sel===-1 ? (AGG[n]?.apps||0) : 1; }
function radarPos(n){ const d=radarData()[n]; return d && d.position ? d.position : ''; }

function radarSVG(names, inds, data, {pctMode=false}={}){
  const n = inds.length;
  if(n < 3 || names.length === 0)
    return `<div class="radar-empty">Select at least one player, and keep 3+ axes, to draw the radar.</div>`;

  const size=340, cx=size/2, cy=size/2, R=118;
  const ang = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt  = (i,r)=>[cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];

  // per-axis max: percentages fixed at 100; counts scaled to the squad's best on that axis
  const scoped = Object.values(data);
  const maxes = inds.map(([,f])=>{
    if(pctMode) return 100;
    let mx = 0;
    for(const p of scoped){ const v = safe(f,p); if(typeof v==='number' && v>mx) mx=v; }
    return mx>0 ? mx : 1;
  });
  const valOf = (p,[,f],i)=>{
    if(pctMode){ const r=safe(f,p); const t=r&&r[0], s=r&&r[1]; return t? (s/t*100) : 0; }
    const v = safe(f,p); return typeof v==='number'? v : 0;
  };

  let svg = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Player comparison radar">`;
  // rings
  [0.25,0.5,0.75,1].forEach(fr=>{
    const pts = Array.from({length:n},(_,i)=>pt(i,R*fr)).map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1" opacity="${fr===1?0.9:0.45}"/>`;
  });
  // spokes + labels
  inds.forEach(([label],i)=>{
    const [ex,ey]=pt(i,R);
    svg += `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.5"/>`;
    const [lx,ly]=pt(i,R+20);
    const anchor = Math.abs(lx-cx)<8 ? 'middle' : (lx>cx? 'start':'end');
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="10.5" fill="var(--mut)" font-family="var(--body)">${label}</text>`;
  });
  // player polygons
  names.forEach((name)=>{
    const p = data[name]; if(!p) return;
    const ci = radarSel.indexOf(name);
    const color = RADAR_COLORS[ci%RADAR_COLORS.length];
    const pts = inds.map((ind,i)=>{
      const frac = Math.max(0, Math.min(1, valOf(p,ind,i)/maxes[i]));
      return pt(i, R*frac);
    });
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'Z';
    svg += `<path d="${d}" fill="${color}" fill-opacity="0.13" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(pp=> svg += `<circle cx="${pp[0].toFixed(1)}" cy="${pp[1].toFixed(1)}" r="2.6" fill="${color}"/>`);
  });
  svg += `</svg>`;
  return svg;
}

function renderRadarPlayers(){
  const data = radarData();
  const box = document.getElementById('radarPlayers'); box.innerHTML='';
  Object.keys(data).sort((a,b)=>a.localeCompare(b)).forEach(name=>{
    const ci = radarSel.indexOf(name);
    const on = ci>=0;
    const overlay = on ? RADAR_COLORS[ci%RADAR_COLORS.length] : null;
    const apps = radarApps(name), pos = radarPos(name);
    const posColor = POS_COLORS[pos] || 'var(--mut)';
    const posBadge = pos ? `<span class="rp-pos" style="background:${POS_COLORS[pos]?POS_COLORS[pos]+'26':'rgba(130,150,187,.15)'};color:${posColor}">${POS_ABBR[pos]||pos}</span>` : '';
    const b = el(`<button class="rp-btn ${on?'on':''}" style="${overlay?`border-color:${overlay}`:''}">
      <span class="rp-av" style="background:${posColor}22;color:${posColor}">${initials(name)}</span>
      <span class="rp-meta">
        <span class="rp-name">${name}</span>
        <span class="rp-sub">${posBadge}${sel===-1?`${apps}g`:''}</span>
      </span>
      ${overlay?`<span class="rp-dot" style="background:${overlay}"></span>`:''}
    </button>`);
    b.addEventListener('click', ()=>{
      const i = radarSel.indexOf(name);
      if(i>=0) radarSel.splice(i,1);
      else radarSel = radarSel.length<5 ? [...radarSel,name] : [...radarSel.slice(1),name];
      renderRadar();
    });
    box.appendChild(b);
  });
}

function renderAxisChips(){
  const build = (elId, all, active, arrRef)=>{
    const box = document.getElementById(elId); box.innerHTML='';
    all.forEach(([label])=>{
      const on = active.includes(label);
      const c = el(`<button class="ax-chip ${on?'on':''}">${label}</button>`);
      c.addEventListener('click', ()=>{
        const arr = arrRef();
        const i = arr.indexOf(label);
        if(i>=0){ if(arr.length>3) arr.splice(i,1); }
        else { if(arr.length<10) arr.push(label); }
        renderRadar();
      });
      box.appendChild(c);
    });
  };
  build('axisCount', RADAR_COUNT, axCount, ()=>axCount);
  build('axisPct',   RADAR_PCT,   axPct,   ()=>axPct);
}

function renderRadar(){
  const data = radarData();
  radarSel = radarSel.filter(n=>data[n]);           // drop names not in current scope
  document.getElementById('radarScope').textContent = sel===-1 ? 'Season averages' : matchLabel(M[sel]);

  const countInds = RADAR_COUNT.filter(m=>axCount.includes(m[0]));
  const pctInds   = RADAR_PCT.filter(m=>axPct.includes(m[0]));
  document.getElementById('radarCount').innerHTML = radarSVG(radarSel, countInds, data, {pctMode:false});
  document.getElementById('radarPct').innerHTML   = radarSVG(radarSel, pctInds,   data, {pctMode:true});

  const lg = document.getElementById('radarLegend'); lg.innerHTML='';
  radarSel.forEach((n,i)=> lg.appendChild(el(
    `<span class="lg-item"><span class="lg-swatch" style="background:${RADAR_COLORS[i%RADAR_COLORS.length]}"></span>${n}</span>`)));

  renderRadarPlayers();
  renderAxisChips();
}

function initRadar(){
  // preselect the 3 outfield players with the most season minutes (fallback: appearances)
  const ranked = Object.entries(AGG)
    .map(([n,a])=>[n, (a.tot && a.tot.mins) || 0, a.apps])
    .sort((x,y)=> y[1]-x[1] || y[2]-x[2]);
  radarSel = ranked.slice(0,3).map(r=>r[0]);
}

function renderCompare(){
  renderRadar();
  const P = scopePlayers();
  const note = document.getElementById('scopeNote');
  note.textContent = sel===-1? `All matches — totals across ${M.length} match${M.length>1?'es':''}` : matchLabel(M[sel]);
  const box = document.getElementById('cbars'); box.innerHTML='';
  if(cmpMode==='count'){
    const [,f] = COUNT_METRICS[cmpMetric];
    const rows = Object.entries(P).map(([n,p])=>[n, f(p), sel===-1? AGG[n].apps : 1]).sort((a,b)=>b[1]-a[1]);
    const max = Math.max(...rows.map(r=>r[1]),0.001);
    rows.forEach(([n,v,apps],i)=> box.appendChild(el(`<div class="cbar ${i===0&&v>0?'top':''}">
      <span class="cname">${n}</span>
      <div class="track"><i style="width:${v/max*100}%"></i></div>
      <span class="cval num">${fmt(v)}${sel===-1?`<small>${apps} app${apps>1?'s':''}</small>`:''}</span></div>`)));
  } else {
    const [,f] = PCT_METRICS[cmpMetric];
    const rows = Object.entries(P).map(([n,p])=>{const [t,s]=f(p);return [n,t?s/t*100:null,t,s];})
      .filter(r=>r[1]!=null).sort((a,b)=>b[1]-a[1] || b[2]-a[2]);
    if(!rows.length){box.appendChild(el(`<div class="empty-note">No attempts recorded for this metric.</div>`));return;}
    rows.forEach(([n,v,t,s],i)=> box.appendChild(el(`<div class="cbar ${i===0?'top':''}">
      <span class="cname">${n}</span>
      <div class="track"><i style="width:${v}%"></i></div>
      <span class="cval num">${Math.round(v)}%<small>${s}/${t}</small></span></div>`)));
  }
}

/* ---------- render all ---------- */
function renderAll(){
  document.getElementById('hsub').textContent =
    sel===-1? `Match Analysis · ${M.length} match${M.length>1?'es':''} · season view` : `Match Analysis · ${matchLabel(M[sel])}`;
  renderTeam();
  renderPlayerList(); renderPlayerCard();
  renderCompare();
}
initCompare();
renderAll();
</script>
